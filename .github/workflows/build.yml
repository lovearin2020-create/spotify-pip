name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SpotifyPiP.xcodeproj -scheme SpotifyPiP -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(isolated|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpotifyPiP.app Payload/
          zip -qry SpotifyPiP.ipa Payload
          ls -l SpotifyPiP.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPiP-ipa
          path: SpotifyPiP.ipa

      # 빌드 결과(로그와 ipa)를 ci 브랜치에 올려서 바로 받아 볼 수 있게 합니다.
      - name: Publish result to ci branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/ 2>/dev/null || echo "no build log" > /tmp/ci/build.log
          grep -E "error:" build.log > /tmp/ci/errors.txt 2>/dev/null || true
          [ -f SpotifyPiP.ipa ] && cp SpotifyPiP.ipa /tmp/ci/ || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/ci/STATUS
          cd /tmp/ci
          git init -q -b ci
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci
